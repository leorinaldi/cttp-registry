# cttp.ai (cttp spec §8): on every push to main the registry contract is exported as static files
# with `cttp serve --export` — `/`, `/<name>`, `/<name>.json`, `/<name>@<label>.json`, byte for
# byte what the live server answers — and published to GitHub Pages behind the custom domain.
# Pages must be set to deploy from GitHub Actions (Settings → Pages → Source); cttp is installed
# straight from its public repository.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cttp
        run: pip install --quiet "git+https://github.com/leorinaldi/cttp.git"
      - name: cttp serve --export
        run: |
          cttp serve --export site --registry .
          echo cttp.ai > site/CNAME
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
